<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Separation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            /* Create a gradient background with multiple shades of blue */
            background: linear-gradient(135deg, #1e3c72, #2a5298, #4c6cb7, #87a4d2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.15); /* Slightly transparent white for the container */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .upload-container label {
            font-size: 18px;
            font-weight: 600;
            color: #fff; /* White text for the label */
            margin-bottom: 20px;
            display: block;
        }

        input[type="file"] {
            margin: 15px 0;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #007bff; /* Blue border for the file input */
            width: 100%;
            background-color: #fff; /* White background */
            color: #333; /* Dark text */
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }

        input[type="file"]:hover {
            background-color: #f0f8ff; /* Light blue background on hover */
            border-color: #0056b3;
        }

        button {
            background: linear-gradient(135deg, #ff6f00, #ff8f00); /* Orange gradient for the button */
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s, transform 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #ff8f00, #ff6f00); /* Reversed gradient on hover */
            transform: scale(1.05);
        }

        .file-name {
            margin-top: 15px;
            font-weight: 400;
            color: #ccc;
            font-size: 14px;
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Add responsiveness */
        @media (max-width: 600px) {
            .upload-container {
                padding: 20px;
                width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <form action="/" method="post" enctype="multipart/form-data" onsubmit="return validateFile()">
            <label for="fileInput">Choose an MP3 or WAV file</label>
            <input type="file" name="file" id="fileInput" accept=".mp3, .wav" required>
            <p class="file-name" id="fileName">No file chosen</p>
            <p class="error-message" id="errorMessage"></p>
            <button type="submit">Upload</button>
        </form>
    </div>

    <script>
        function validateFile() {
            var fileInput = document.getElementById("fileInput");
            var fileName = fileInput.value;
            var allowedExtensions = /(\.mp3|\.wav)$/i;
            var errorMessage = document.getElementById("errorMessage");

            if (!allowedExtensions.exec(fileName)) {
                errorMessage.textContent = "Invalid file type! Please upload an MP3 or WAV file.";
                fileInput.value = ""; 
                return false;
            }
            errorMessage.textContent = "";
            return true;
        }

        document.getElementById("fileInput").addEventListener("change", function() {
            var fileName = this.files[0] ? this.files[0].name : "No file chosen";
            document.getElementById("fileName").textContent = "Selected file: " + fileName;
            document.getElementById("errorMessage").textContent = "";
        });
    </script>
</body>
</html>
